<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Plataforma de crédito</title>
<desc id="desc">Painel e API de uma plataforma de crédito digital: simulação, análise em etapas, formalização com assinatura eletrônica, parcelas e o módulo de relatórios regulatórios ao Banco Central (CADOC).</desc>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-2833.66}}
.orbit{animation:orbit 8s linear infinite}
.orbit2{animation:orbit 8s linear -4s infinite}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-24px,-10px)}}
.drift{animation:float 9s ease-in-out infinite alternate}</style>
