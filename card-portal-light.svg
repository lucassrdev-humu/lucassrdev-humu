<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Portal do cliente</title>
<desc id="desc">Área do cliente para contratar e acompanhar crédito, com tema próprio e foco em clareza de informação.</desc>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-1613.66}}
.orbit{animation:orbit 8s linear infinite}
.orbit2{animation:orbit 8s linear -4s infinite}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-24px,-10px)}}
.drift{animation:float 9s ease-in-out infinite alternate}</style>
<defs><clipPath id="cardclip"><rect width="590" height="236" rx="20"/></clipPath>
<linearGradient id="mono" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#209fb5"/><stop offset="1" stop-color="#1e66f5"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#209fb5" stop-opacity="0.14"/><stop offset="1" stop-color="#209fb5" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="589" height="235" rx="20" fill="#e6e9ef"/>
<rect x=".5" y=".5" width="589" height="235" rx="20" fill="url(#glow)"/>

<rect x=".5" y=".5" width="589" height="235" rx="20" stroke="#ccd0da"/>
<rect class="orbit" x=".5" y=".5" width="589" height="235" rx="20" stroke="#209fb5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="140 1473.66"/>
<rect class="orbit2" x=".5" y=".5" width="589" height="235" rx="20" stroke="#1e66f5" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="70 1543.66"/>
<g class="rise">
<rect x="28" y="28" width="48" height="48" rx="13" fill="url(#mono)"/>
<text x="52" y="58.5" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="18" font-weight="800" fill="#eff1f5">PC</text>
<text x="92" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#4c4f69">Portal do cliente</text>
<text x="92" y="72" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" fill="#8c8fa1">repositório privado</text>
</g>

<g class="rise" style="animation-delay:0.25s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#6c6f85"><text x="28" y="114">Área do cliente para contratar e acompanhar crédito, com tema</text><text x="28" y="136">próprio e foco em clareza de informação.</text></g>
<g class="pop" style="animation-delay:0.6s">
<rect x="28" y="186" width="56" height="26" rx="8" fill="#eff1f5"/>
<text x="38" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5c5f77">react</text>
</g><g class="pop" style="animation-delay:0.65s">
<rect x="92" y="186" width="92" height="26" rx="8" fill="#eff1f5"/>
<text x="102" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5c5f77">typescript</text>
</g><g class="pop" style="animation-delay:0.7s">
<rect x="192" y="186" width="77.6" height="26" rx="8" fill="#eff1f5"/>
<text x="202" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5c5f77">tailwind</text>
</g><g class="pop" style="animation-delay:0.75s">
<rect x="277.6" y="186" width="63.2" height="26" rx="8" fill="#eff1f5"/>
<text x="287.6" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#5c5f77">vitest</text>
</g>
</svg>
