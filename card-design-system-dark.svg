<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Design system</title>
<desc id="desc">Pacote de componentes compartilhado entre os produtos: fiel ao Figma, com tokens claro e escuro, acessibilidade e versionamento por changesets.</desc>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-1613.66}}
.orbit{animation:orbit 8s linear infinite}
.orbit2{animation:orbit 8s linear -4s infinite}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-24px,-10px)}}
.drift{animation:float 9s ease-in-out infinite alternate}</style>
<defs><clipPath id="cardclip"><rect width="590" height="236" rx="20"/></clipPath>
<linearGradient id="mono" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89b4fa"/><stop offset="1" stop-color="#94e2d5"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#89b4fa" stop-opacity="0.18"/><stop offset="1" stop-color="#89b4fa" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="589" height="235" rx="20" fill="#1b1b2a"/>
<rect x=".5" y=".5" width="589" height="235" rx="20" fill="url(#glow)"/>

<rect x=".5" y=".5" width="589" height="235" rx="20" stroke="#313244"/>
<rect class="orbit" x=".5" y=".5" width="589" height="235" rx="20" stroke="#89b4fa" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="140 1473.66"/>
<rect class="orbit2" x=".5" y=".5" width="589" height="235" rx="20" stroke="#94e2d5" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="70 1543.66"/>
<g class="rise">
<rect x="28" y="28" width="48" height="48" rx="13" fill="url(#mono)"/>
<text x="52" y="58.5" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="18" font-weight="800" fill="#1e1e2e">DS</text>
<text x="92" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" fill="#cdd6f4">Design system</text>
<text x="92" y="72" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12.5" fill="#7f849c">repositório privado</text>
</g>

<g class="rise" style="animation-delay:0.25s" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI Variable Display','Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#a6adc8"><text x="28" y="114">Pacote de componentes compartilhado entre os produtos: fiel ao</text><text x="28" y="136">Figma, com tokens claro e escuro, acessibilidade e versionamento</text><text x="28" y="158">por changesets.</text></g>
<g class="pop" style="animation-delay:0.6s">
<rect x="28" y="186" width="56" height="26" rx="8" fill="#313244"/>
<text x="38" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#bac2de">react</text>
</g><g class="pop" style="animation-delay:0.65s">
<rect x="92" y="186" width="56" height="26" rx="8" fill="#313244"/>
<text x="102" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#bac2de">radix</text>
</g><g class="pop" style="animation-delay:0.7s">
<rect x="156" y="186" width="84.8" height="26" rx="8" fill="#313244"/>
<text x="166" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#bac2de">storybook</text>
</g><g class="pop" style="animation-delay:0.75s">
<rect x="248.8" y="186" width="84.8" height="26" rx="8" fill="#313244"/>
<text x="258.8" y="203" font-family="ui-monospace,'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,monospace" font-size="12" fill="#bac2de">turborepo</text>
</g>
</svg>
